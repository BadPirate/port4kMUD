name: Port4kMUD CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test_server:
    name: Build and Test Server
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x] # Test against Node.js 22.x

    defaults:
      run:
        working-directory: ./server

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn' # Cache yarn dependencies
        cache-dependency-path: './server/yarn.lock'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run linters
      run: yarn lint # Ensure code style and quality

    - name: Build project
      run: yarn build

    - name: Run tests
      run: yarn test
      env:
        CI: true # Often useful to indicate running in a CI environment
        
    # Keep the build output around for inspection.  Nothing downstream consumes
    # it - the e2e job installs its own dependencies - so node_modules is left out.
    - name: Upload server build
      uses: actions/upload-artifact@v7
      with:
        include-hidden-files: true  # the action skips dot-prefixed paths, and .next is one
        name: server-build
        path: |
          ./server/.next
          ./server/dist

  build_mud:
    name: Build MUD
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mud

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Configure MUD
      run: ./configure

    - name: Build MUD
      run: cd src && make

    - name: Verify build artifacts
      run: |
        if [ ! -f "bin/circle" ]; then
          echo "MUD build failed: bin/circle not found"
          exit 1
        fi
        
    # Upload the built MUD binary and necessary files as an artifact
    - name: Upload MUD build
      uses: actions/upload-artifact@v7
      with:
        name: mud-build
        path: |
          ./mud/bin/circle
          ./mud/lib

  e2e_tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [build_and_test_server, build_mud]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    # Only the compiled MUD comes from an artifact; the server's dependencies are
    # installed here.  Artifacts do not carry the executable bit, so anything
    # unpacked from one has to have it put back by hand below.
    - name: Download MUD build
      uses: actions/download-artifact@v8
      with:
        name: mud-build
        path: ./mud
    
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'yarn'
        cache-dependency-path: './server/yarn.lock'
    
    - name: Install dependencies
      working-directory: ./server
      run: yarn install --frozen-lockfile
        
    - name: Prepare test scripts
      run: |
        chmod +x ./server/e2e/test-launch.sh
        chmod +x ./server/e2e/test-cleanup.sh
        chmod +x ./mud/bin/circle
    
    - name: Install Playwright browsers
      run: |
        cd server
        npx playwright install --with-deps chromium
    
    - name: Run end-to-end tests
      run: |
        cd server
        yarn test:e2e
      env:
        # The portal's accounts database and session secret. The database is a
        # throwaway file under test-results/; without a secret the server
        # refuses to start in production mode.
        AUTH_DATABASE_PATH: ./test-results/portal-e2e.sqlite
        BETTER_AUTH_SECRET: port4k-ci-secret-not-for-production-0123456789
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-results
        path: server/test-results/
        retention-days: 7

  docker_image:
    name: Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: port4kmud:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The deployed image has to keep a working C toolchain, because the in-game
    # `copyover <branch>` command rebuilds the MUD from source at runtime
    # (mud/src/copyover_update.c) before exec'ing the new binary onto the live
    # player sockets.  This replays that exact command chain inside the final
    # image, so a Dockerfile change that trims too much fails here rather than
    # in production.
    - name: Verify copyover can still rebuild the MUD
      run: |
        docker run --rm --entrypoint bash port4kmud:ci -c '
          set -eux
          cd /app/mud
          rm -f bin/circle src/*.o
          autoconf
          ./configure
          make -C src
          # A successful link is already proof that libcrypt-dev is present:
          # conf.h.in hardcodes HAVE_CRYPT, so the sources call crypt()
          # unconditionally and the link fails without it.
          test -x bin/circle
          ldd bin/circle
          git --version
          diff --version | head -1
        '

    - name: Verify the web build shipped and dev dependencies did not
      run: |
        docker run --rm --entrypoint bash port4kmud:ci -c '
          set -eux
          test -f /app/server/dist/server.js
          test -d /app/server/.next
          test -x /app/server/node_modules/.bin/prisma
          test -d /app/mud/lib-dist
          # These are devDependencies; their presence means the runtime stage is
          # picking up the wrong node_modules.
          test ! -d /app/server/node_modules/jest
          test ! -d /app/server/node_modules/eslint
          test ! -d /app/server/node_modules/@playwright
          test ! -d /app/server/.next/cache
        '

    # Asserting files exist does not prove the image boots.  The two things
    # most likely to break are both startup-time: `prisma migrate deploy`
    # running out of the pruned production node_modules, and dist/server.js
    # resolving the generated Prisma client.  launch.sh backgrounds the MUD
    # without supervising it, so the container staying up proves nothing about
    # the game - port 4000 is probed directly.
    - name: Verify the container boots
      run: |
        set -eux
        docker run -d --name port4k-smoke \
          -p 3000:3000 -p 4000:4000 \
          -e PORT=3000 \
          -e BETTER_AUTH_SECRET=port4k-ci-secret-not-for-production-0123456789 \
          port4kmud:ci

        for i in $(seq 1 60); do
          if curl -fsS -o /dev/null http://127.0.0.1:3000/; then break; fi
          if [ "$(docker inspect -f '{{.State.Running}}' port4k-smoke)" != "true" ]; then
            echo "container exited before answering"; break
          fi
          sleep 2
        done

        docker logs port4k-smoke

        curl -fsS -o /dev/null http://127.0.0.1:3000/
        docker exec port4k-smoke bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/4000'
        docker logs port4k-smoke 2>&1 | grep -q "Starting web interface on port"

    - name: Stop the smoke-test container
      if: always()
      run: docker rm -f port4k-smoke || true

    - name: Report image size
      run: docker image ls port4kmud:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
